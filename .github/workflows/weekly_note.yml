# 公開版は手動実行のみ。実行前に配信先・API利用条件を確認する。
name: Weekly Note Draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate note draft
        run: python -m bot.generate_note_draft

      - name: Save draft for review
        uses: actions/upload-artifact@v4
        with:
          name: note-draft
          path: output/*.md
          retention-days: 7
