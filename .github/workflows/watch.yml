# Portfolio runs preview feeds only. Live delivery requires durable local state.
name: News collection preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview collection without LLM or delivery
        run: python main.py --dry-run
